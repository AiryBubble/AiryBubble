695c}.avatar-wrapper{flex:0.8;display:flex;justify-content:center;align-items:center}.avatar-ring{position:relative;width:240px;height:240px;border-radius:50%;padding:5px;background:conic-gradient(from 0deg,#4fc3f7,#81c784,#ffd54f,#4fc3f7);animation:spinRing 10s ease-in-out infinite;box-shadow:0 0 50px rgba(0,200,150,0.2)}@keyframes spinRing{0%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}100%{transform:rotate(-30deg)}}.avatar-ring-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#ffffff;display:flex;align-items:center;justify-content:center}.avatar-ring-inner img{width:100%;height:100%;object-fit:cover;border-radius:50%;transition:transform 0.6s ease}.avatar-ring:hover .avatar-ring-inner img{transform:scale(1.05) rotate(-5deg)}.avatar-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e0f7fa,#e8f5e9);font-size:5rem;font-weight:300;color:rgba(0,0,0,0.05);letter-spacing:4px;user-select:none}.avatar-placeholder span{background:linear-gradient(135deg,#4fc3f7,#81c784);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:4.5rem;font-weight:600}@media(max-width:820px){.card{flex-direction:column-reverse;text-align:center;padding:2rem 1.8rem;gap:2rem}.profile h1{font-size:2.6rem}.subtitle{border-left:none;padding-left:0;border-top:3px solid rgba(0,200,150,0.25);padding-top:1rem}.links{justify-content:center}.avatar-ring{width:180px;height:180px}.badge{font-size:0.6rem}.license{text-align:center}}@media(max-width:480px){.card{padding:1.5rem 1rem;border-radius:24px}.profile h1{font-size:2rem}.avatar-ring{width:140px;height:140px}.links a{font-size:0.8rem}}.glow-line{position:fixed;bottom:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,#4fc3f7,#81c784,#ffd54f,transparent);opacity:0.5;z-index:2}.particle{position:fixed;border-radius:50%;background:rgba(0,200,150,0.1);pointer-events:none;z-index:0;animation:particleFloat 15s infinite linear}.particle--1{width:6px;height:6px;top:10%;left:5%;animation-duration:20s;background:rgba(79,195,247,0.15)}.particle--2{width:8px;height:8px;top:70%;right:8%;animation-duration:25s;animation-delay:-5s;background:rgba(129,199,132,0.12)}.particle--3{width:4px;height:4px;top:30%;right:20%;animation-duration:18s;animation-delay:-10s;background:rgba(255,213,79,0.1)}@keyframes particleFloat{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(100px,-200px) scale(0);opacity:0}}</style>

	  const chars = 'АБВГҐДЃЂЕЁЀЄЖЗЅИІЇЙЍЈКЌЛЉМНЊОПРСТЋУЎФХЦЧЏШЩЪЫЬЭЮЯӐӒӘӚӔҒӶГ̧ԂԄԐԆЗ̱Ԑ̈ҔӖӁҖӜҘӞӠӢӤҊҠҚҞԞӃҜӅԒԠӍԚҢӉӇԢԊԨҤӨӦӪҦҎҪҬҴӲӮҮҰӰҲӾҺҶӋҸӴҨҼҾӸҌӬӀҀѸѠѾѺѢꙖѤѦѪѨѬѮѰѲѴѶꙮꙨꙪꙬԀ';
	  return Array.from({ length }, () =>
        chars.charAt(Math.floor(Math.random() * chars.length))
	  ).join('');
	}
	  const intervalMs = 1000;
	  setInterval(() => {
	  document.title = randomString(100);
	}, intervalMs);
  </script>
