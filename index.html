  <style>*{margin:0;padding:0;box-sizing:border-box}@font-face{font-family:"BIZ UDPGothic";src:local("BIZ UDPGothic Regular"),local("BIZUDPGothic-Regular"),url("/BIZUDPGothic-Regular.woff2") format("woff2");font-style:normal;font-display:swap}body{font-family:"BIZ UDPGothic","BIZ UDPゴシック",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e8f5e9;overflow:hidden;position:relative}.bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;background:linear-gradient(135deg,#e3f2fd 0%,#e8f5e9 40%,#f1f8e9 70%,#e0f7fa 100%)}.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.4;animation:orbFloat 20s ease-in-out infinite alternate}.orb--1{width:500px;height:500px;background:#4fc3f7;top:-150px;left:-150px;animation-duration:22s;opacity:0.3}.orb--2{width:400px;height:400px;background:#81c784;bottom:-100px;right:-100px;animation-duration:18s;animation-delay:-4s;opacity:0.35}.orb--3{width:300px;height:300px;background:#ffd54f;top:50%;left:60%;animation-duration:16s;animation-delay:-8s;opacity:0.2}.orb--4{width:250px;height:250px;background:#4dd0e1;bottom:20%;left:10%;animation-duration:20s;animation-delay:-12s;opacity:0.25}@keyframes orbFloat{0%{transform:translate(0,0) scale(1)}33%{transform:translate(50px,-70px) scale(1.15)}66%{transform:translate(-30px,50px) scale(0.85)}100%{transform:translate(20px,-20px) scale(1.05)}}.grid-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(0,200,150,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,150,255,0.08) 1px,transparent 1px);background-size:50px 50px;z-index:0;pointer-events:none}.container{position:relative;z-index:1;width:90%;max-width:1100px;padding:2rem}.card{display:flex;gap:3rem;align-items:center;background:rgba(255,255,255,0.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:32px;padding:3rem 3.5rem;border:1px solid rgba(0,200,150,0.2);box-shadow:0 20px 60px rgba(0,150,100,0.15),0 0 40px rgba(0,200,255,0.08),inset 0 1px 0 rgba(255,255,255,0.6);transition:all 0.4s ease}.card:hover{border-color:rgba(0,200,150,0.35);box-shadow:0 30px 80px rgba(0,150,100,0.2),0 0 60px rgba(0,200,255,0.12),inset 0 1px 0 rgba(255,255,255,0.8);transform:translateY(-2px)}.profile{flex:1.2;color:#1a3a2a}.badge{display:inline-block;background:rgba(0,200,150,0.12);border:1px solid rgba(0,200,150,0.25);padding:0.3rem 1.2rem;border-radius:100px;font-size:0.7rem;letter-spacing:2px;text-transform:uppercase;color:#00897b;margin-bottom:1.2rem;backdrop-filter:blur(4px);font-weight:600}.profile h1{font-size:3.2rem;font-weight:500;margin-bottom:0.3rem;background:linear-gradient(135deg,#00695c 0%,#00897b 40%,#0288d1 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.5px;line-height:1.1}.profile h1 .accent{background:linear-gradient(135deg,#0288d1,#4fc3f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.subtitle{font-size:1.05rem;color:rgba(0,80,70,0.7);margin-bottom:1.8rem;line-height:1.7;border-left:3px solid rgba(0,200,150,0.3);padding-left:1.2rem;font-weight:300}.subtitle strong{color:#00695c;font-weight:500}.links{display:flex;flex-wrap:wrap;gap:0.6rem 1.2rem;margin:1.8rem 0 1.2rem}.links a{color:#00796b;text-decoration:none;font-size:0.9rem;display:inline-flex;align-items:center;gap:0.4rem;transition:all 0.25s ease;padding:0.2rem 0;border-bottom:2px solid transparent;font-family:monospace;letter-spacing:0.3px;font-weight:500}.links a::before{content:"●";color:#4fc3f7;font-size:0.6rem;transition:transform 0.2s ease}.links a:hover{color:#004d40;border-bottom-color:#4fc3f7;transform:translateX(4px)}.links a:hover::before{transform:translateX(3px) scale(1.2)}.license{font-size:0.75rem;color:rgba(0,80,70,0.35);margin-top:1.2rem;font-family:monospace;letter-spacing:0.5px}.license a{color:rgba(0,80,70,0.4);text-decoration:none;transition:color 0.2s}.license a:hover{color:#00695c}.avatar-wrapper{flex:0.8;display:flex;justify-content:center;align-items:center}.avatar-ring{position:relative;width:240px;height:240px;border-radius:50%;padding:5px;background:conic-gradient(from 0deg,#4fc3f7,#81c784,#ffd54f,#4fc3f7);animation:spinRing 10s ease-in-out infinite;box-shadow:0 0 50px rgba(0,200,150,0.2)}@keyframes spinRing{0%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}100%{transform:rotate(-30deg)}}.avatar-ring-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#ffffff;display:flex;align-items:center;justify-content:center}.avatar-ring-inner img{width:100%;height:100%;object-fit:cover;border-radius:50%;transition:transform 0.6s ease}.avatar-ring:hover .avatar-ring-inner img{transform:scale(1.05) rotate(-5deg)}.avatar-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e0f7fa,#e8f5e9);font-size:5rem;font-weight:300;color:rgba(0,0,0,0.05);letter-spacing:4px;user-select:none}.avatar-placeholder span{background:linear-gradient(135deg,#4fc3f7,#81c784);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:4.5rem;font-weight:600}@media(max-width:820px){.card{flex-direction:column-reverse;text-align:center;padding:2rem 1.8rem;gap:2rem}.profile h1{font-size:2.6rem}.subtitle{border-left:none;padding-left:0;border-top:3px solid rgba(0,200,150,0.25);padding-top:1rem}.links{justify-content:center}.avatar-ring{width:180px;height:180px}.badge{font-size:0.6rem}.license{text-align:center}}@media(max-width:480px){.card{padding:1.5rem 1rem;border-radius:24px}.profile h1{font-size:2rem}.avatar-ring{width:140px;height:140px}.links a{font-size:0.8rem}}.glow-line{position:fixed;bottom:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,#4fc3f7,#81c784,#ffd54f,transparent);opacity:0.5;z-index:2}.particle{position:fixed;border-radius:50%;background:rgba(0,200,150,0.1);pointer-events:none;z-index:0;animation:particleFloat 15s infinite linear}.particle--1{width:6px;height:6px;top:10%;left:5%;animation-duration:20s;background:rgba(79,195,247,0.15)}.particle--2{width:8px;height:8px;top:70%;right:8%;animation-duration:25s;animation-delay:-5s;background:rgba(129,199,132,0.12)}.particle--3{width:4px;height:4px;top:30%;right:20%;animation-duration:18s;animation-delay:-10s;background:rgba(255,213,79,0.1)}@keyframes particleFloat{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(100px,-200px) scale(0);opacity:0}}</style>
</head>
<body>

  <script>
	function randomString(length = 100) {
	  const chars = 'АБВГҐДЃЂЕЁЀЄЖЗЅИІЇЙЍЈКЌЛЉМНЊОПРСТЋУЎФХЦЧЏШЩЪЫЬЭЮЯӐӒӘӚӔҒӶГ̧ԂԄԐԆЗ̱Ԑ̈ҔӖӁҖӜҘӞӠӢӤҊҠҚҞԞӃҜӅԒԠӍԚҢӉӇԢԊԨҤӨӦӪҦҎҪҬҴӲӮҮҰӰҲӾҺҶӋҸӴҨҼҾӸҌӬӀҀѸѠѾѺѢꙖѤѦѪѨѬѮѰѲѴѶꙮꙨꙪꙬԀ';
	  return Array.from({ length }, () =>
        chars.charAt(Math.floor(Math.random() * chars.length))
	  ).join('');
	}
	  const intervalMs = 1000;
	  setInterval(() => {
	  document.title = randomString(100);
	}, intervalMs);
  </script>
